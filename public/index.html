<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trip.com 国・地域別 料金比較</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%8F%A8%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Trip.com 国・地域別 料金比較</h1>
      <p class="lede">
        Trip.com のホテルURLを貼ると、同じ客室・同じプランの料金を各国・地域のサイトから取得して比較します。
      </p>
      <p class="demo-banner" id="demo-banner" hidden>
        デモモードで動作中です。表示される料金は保存済みのサンプルで、現在の実売価格ではありません。
      </p>
    </header>

    <main>
      <form id="compare-form" class="card">
        <label class="field">
          <span class="field-label">Trip.com のホテルURL</span>
          <input
            type="url"
            id="trip-url"
            name="tripUrl"
            required
            placeholder="https://jp.trip.com/hotels/detail/?hotelId=..."
            autocomplete="url"
          />
          <span class="field-hint">日程・人数がURLに含まれていない場合は、30日後の1泊・大人2名で比較します。</span>
        </label>

        <fieldset class="field">
          <legend class="field-label">比較する市場</legend>
          <div class="market-grid" id="market-grid"></div>
        </fieldset>

        <div class="field-row">
          <label class="field">
            <span class="field-label">表示通貨</span>
            <select id="currency" name="targetCurrency">
              <option value="JPY" selected>JPY（円）</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="SGD">SGD</option>
              <option value="THB">THB</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">取得回数（中央値を採用）</span>
            <select id="samples" name="samples">
              <option value="1" selected>1回</option>
              <option value="2">2回</option>
              <option value="3">3回</option>
            </select>
          </label>
        </div>

        <button type="submit" id="submit-button" class="primary">比較する</button>
        <p class="form-error" id="form-error" hidden></p>
      </form>

      <section class="card" id="progress-card" hidden aria-live="polite">
        <h2 id="progress-title">比較中</h2>
        <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
        <ul class="market-status" id="market-status"></ul>
      </section>

      <section id="result" hidden>
        <div class="card">
          <h2 id="hotel-name">—</h2>
          <p class="stay-summary" id="stay-summary"></p>
          <p class="headline" id="headline"></p>
          <p class="matched-on" id="matched-on"></p>
        </div>

        <div class="card table-card">
          <div class="table-scroll">
            <table id="price-table">
              <thead>
                <tr>
                  <th scope="col">市場</th>
                  <th scope="col" class="numeric">料金</th>
                  <th scope="col" class="numeric">日本との差</th>
                  <th scope="col">条件</th>
                  <th scope="col">予約</th>
                </tr>
              </thead>
              <tbody id="price-rows"></tbody>
            </table>
          </div>
          <p class="notes" id="notes"></p>
        </div>
      </section>

      <p class="disclaimer">
        価格は在庫・時間帯・ログイン状態・ABテストで変動します。表示は取得時点のもので、予約成立を保証しません。
      </p>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
